body{background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",system-ui,sans-serif;font-size:13px;padding:24px 20px 36px;min-height:100vh;}
header{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:20px;}

.sub{color:var(--sec);font-size:11.5px}
.nav-link{font-size:11.5px;color:var(--sec);text-decoration:none;border:1px solid currentColor;border-radius:4px;padding:4px 10px;opacity:.7;transition:opacity .15s;white-space:nowrap;align-self:center;}
.nav-link:hover{opacity:1}
.card{background:var(--surface);border-radius:8px;padding:16px 18px 14px;}
#chart1{position:relative;user-select:none;}
svg.sc{width:100%;height:auto;display:block;overflow:visible;cursor:grab;}
svg.sc.dragging{cursor:grabbing;}
.grid-line{stroke:var(--div);stroke-opacity:.13;stroke-width:1}
.axis-line{stroke:var(--div);stroke-opacity:.3;stroke-width:1}
.tick{fill:var(--sec);font-size:9.5px;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums;}
.ax-label{fill:var(--sec);font-size:9.5px;letter-spacing:.04em;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;}
.dot-ind{stroke:none;opacity:.45;cursor:crosshair;}
.dot-ind:hover{opacity:1;stroke:#fff;stroke-width:1.5}
.dot-mean{stroke:var(--ring);stroke-width:2.5;cursor:pointer;filter:drop-shadow(0 1px 3px rgba(0,0,0,.22));transition:stroke-width .1s;}
.dot-mean:hover{stroke-width:3.5;}
.city-label{fill:var(--text);font-size:9px;font-weight:600;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;pointer-events:none;}
.zoom-btns{position:absolute;top:4px;right:4px;display:flex;gap:4px;}
.zoom-btn{background:var(--surface);border:1px solid var(--div);border-radius:4px;color:var(--sec);font-size:13px;width:24px;height:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.7;transition:opacity .15s;}
.zoom-btn:hover{opacity:1}
.leg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 20px;margin-top:14px;}
.leg-head{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--sec);font-weight:600;margin-bottom:6px;}
.leg-items{display:flex;flex-wrap:wrap;gap:5px 12px}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--sec)}
.leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;border:1.5px solid var(--ring);box-shadow:0 0 0 1px rgba(0,0,0,.1);}
#tip{position:fixed;z-index:9999;display:none;background:var(--tip-bg);color:var(--tip-txt);font-size:11px;padding:9px 12px;border-radius:5px;pointer-events:none;max-width:220px;line-height:1.55;box-shadow:0 3px 14px rgba(0,0,0,.3);}
.tip-name{font-family:Georgia,serif;font-size:12.5px;margin-bottom:1px}
.tip-city{color:rgba(239,241,236,.5);font-size:10px;margin-bottom:6px}
.tip-row{display:flex;justify-content:space-between;gap:10px;margin-bottom:1px}
.tip-lbl{color:rgba(239,241,236,.6)}
.tip-val{font-weight:600;font-variant-numeric:tabular-nums}
.tip-sep{border:none;border-top:1px solid rgba(239,241,236,.12);margin:5px 0}
</style>

const MEANS = {"Bordeaux":{"mx":1.4224,"my":16.5,"n":8,"co":"France"},"Lyon":{"mx":1.439,"my":19.6,"n":10,"co":"France"},"Marseille":{"mx":1.559,"my":19.2,"n":3,"co":"France"},"Nantes":{"mx":1.4809,"my":15.6,"n":6,"co":"France"},"Nice":{"mx":1.7604,"my":19.0,"n":6,"co":"France"},"Paris":{"mx":1.1755,"my":25.6,"n":47,"co":"France"},"Berlin":{"mx":1.3768,"my":23.6,"n":14,"co":"Germany"},"Cologne":{"mx":1.444,"my":25.7,"n":9,"co":"Germany"},"Cashel":{"mx":0.7373,"my":19.4,"n":1,"co":"Ireland"},"Doolin":{"mx":1.25,"my":15.1,"n":1,"co":"Ireland"},"Dublin City":{"mx":0.4642,"my":13.6,"n":5,"co":"Ireland"},"Galway":{"mx":1.625,"my":12.2,"n":2,"co":"Ireland"},"Kilkenny":{"mx":0.3571,"my":24.0,"n":1,"co":"Ireland"},"Ballydehob":{"mx":0.5252,"my":15.1,"n":1,"co":"Ireland"},"Ardmore":{"mx":0.6261,"my":31.5,"n":1,"co":"Ireland"},"Thomastown":{"mx":0.7773,"my":19.6,"n":1,"co":"Ireland"},"Bullaun":{"mx":0.6513,"my":13.1,"n":1,"co":"Ireland"},"Maynooth":{"mx":0.6933,"my":20.0,"n":1,"co":"Ireland"},"Adare":{"mx":0.7773,"my":26.1,"n":1,"co":"Ireland"},"Rome":{"mx":1.5575,"my":24.2,"n":10,"co":"Italy"},"Madrid":{"mx":1.3822,"my":18.1,"n":18,"co":"Spain"},"Auckland":{"mx":0.9822,"my":8.7,"n":3,"co":"New Zealand"},"Waiheke Island":{"mx":0.6748,"my":12.7,"n":2,"co":"New Zealand"},"Christchurch":{"mx":0.9645,"my":8.3,"n":1,"co":"New Zealand"},"Queenstown":{"mx":1.2722,"my":9.0,"n":3,"co":"New Zealand"},"Wānaka":{"mx":0.627,"my":5.9,"n":1,"co":"New Zealand"},"Wellington":{"mx":0.6341,"my":9.0,"n":2,"co":"New Zealand"}};

const CITY_COLOR = {
  'Paris':        '#e74c3c',
  'Lyon':         '#e67e22',
  'Bordeaux':     '#c0392b',
  'Nice':         '#d35400',
  'Nantes':       '#f39c12',
  'Marseille':    '#f1c40f',
  'Berlin':       '#5D7690',
  'Cologne':      '#3a5f7a',
  'Madrid':       '#B98A3A',
  'Dublin City':  '#2ecc71',

  'Adare':        '#1a7a5e',

  'Maynooth':     '#12996e',

  'Waiheke Island':'#4a7068',
  'Wellington':   '#5a8070',
  'Christchurch': '#6a9080',
  'Wānaka':       '#3d5e55',
};

const W=620,H=390,PAD={top:18,right:24,bottom:46,left:54};
const CW=W-PAD.left-PAD.right,CH=H-PAD.top-PAD.bottom;
const XDEF={min:0.25,max:3.1},YDEF={min:4,max:65};
let view={xmin:XDEF.min,xmax:XDEF.max,ymin:YDEF.min,ymax:YDEF.max};

function tx(v){return PAD.left+(v-view.xmin)/(view.xmax-view.xmin)*CW;}
function ty(v){return PAD.top+CH-(v-view.ymin)/(view.ymax-view.ymin)*CH;}
function f1(v){return v.toFixed(1);}
function fTick(v){const r=+v.toPrecision(6);return Number.isInteger(r)?r:r;}

function niceTicks(mn,mx,target=6){
  const range=mx-mn;
  const base=Math.pow(10,Math.floor(Math.log10(range/target)));
  for(const m of [1,2,2.5,5,10]){
    const s=base*m;
    if(range/s<=target+0.5){
      const first=Math.ceil(mn/s-1e-9)*s;
      const ticks=[];
      for(let v=first;v<=mx+s*0.01;v+=s)ticks.push(+v.toPrecision(8));
      return ticks;
    }
  }
  return [];
}

function render(){
  const {xmin,xmax,ymin,ymax}=view;
  const xt=niceTicks(xmin,xmax);
  const yt=niceTicks(ymin,ymax);

  let s=`<svg class="sc" viewBox="0 0 ${W} ${H}">`;
  s+=`<defs><clipPath id="pc"><rect x="${PAD.left}" y="${PAD.top}" width="${CW}" height="${CH}"/></clipPath></defs>`;

  yt.forEach(v=>{
    if(v<ymin-1e-9||v>ymax+1e-9) return;
    const y=ty(v);
    s+=`<line class="grid-line" x1="${PAD.left}" y1="${y}" x2="${PAD.left+CW}" y2="${y}"/>`;
    s+=`<text class="tick" x="${PAD.left-7}" y="${y+3.5}" text-anchor="end">${fTick(v)}</text>`;
  });
  xt.forEach(v=>{
    if(v<xmin-1e-9||v>xmax+1e-9) return;
    const x=tx(v);
    s+=`<line class="grid-line" x1="${x}" y1="${PAD.top}" x2="${x}" y2="${PAD.top+CH}"/>`;
    s+=`<text class="tick" x="${x}" y="${PAD.top+CH+13}" text-anchor="middle">&#215;${fTick(v)}</text>`;
  });
  s+=`<line class="axis-line" x1="${PAD.left}" y1="${PAD.top}" x2="${PAD.left}" y2="${PAD.top+CH}"/>`;
  s+=`<line class="axis-line" x1="${PAD.left}" y1="${PAD.top+CH}" x2="${PAD.left+CW}" y2="${PAD.top+CH}"/>`;
  s+=`<text class="ax-label" transform="rotate(-90)" x="${-(PAD.top+CH/2)}" y="15" text-anchor="middle">Parité Resto / plat (&#8364;)</text>`;
  s+=`<text class="ax-label" x="${PAD.left+CW/2}" y="${H-6}" text-anchor="middle">&#215; PIB / habitant local</text>`;

  s+=`<g clip-path="url(#pc)">`;
  DATA.forEach((r,i)=>{
    const cx=tx(r.x1),cy=ty(r.y);
    s+=`<circle class="dot-ind" cx="${cx}" cy="${cy}" r="4" fill="#8BA098" data-i="${i}"/>`;
  });
  Object.entries(MEANS).forEach(([ci,m])=>{
    if(m.n<2) return;
    const cx=tx(m.mx),cy=ty(m.my);
    const rad=Math.max(7,Math.min(14,Math.sqrt(m.n)*2.4));
    s+=`<circle cx="${cx}" cy="${cy}" r="${rad+2.5}" fill="var(--ring)" stroke="none"/>`;
  });
  Object.entries(MEANS).forEach(([ci,m])=>{
    if(m.n<2) return;
    const col=CITY_COLOR[ci]||'#95a5a6';
    const cx=tx(m.mx),cy=ty(m.my);
    const rad=Math.max(7,Math.min(14,Math.sqrt(m.n)*2.4));
    s+=`<circle class="dot-mean" cx="${cx}" cy="${cy}" r="${rad}" fill="${col}" data-city="${ci}"/>`;
  });
  // Labels fixes pour les villes clés
  const FIXED_LABELS={
    'Paris':       {dx:13,dy:4,anchor:'start'},
    'Dublin City': {dx:-13,dy:4,anchor:'end'},
    'Berlin':      {dx:13,dy:-9,anchor:'start'},
    'Madrid':      {dx:13,dy:4,anchor:'start'},
    'Auckland':    {dx:0,dy:16,anchor:'middle'},
    'Nice':        {dx:-13,dy:4,anchor:'end'},
  };
  Object.entries(FIXED_LABELS).forEach(([ci,cfg])=>{
    const m=MEANS[ci];
    if(!m||m.n<2) return;
    const cx=tx(m.mx),cy=ty(m.my);
    const lbl=ci==='Dublin City'?'Dublin':ci;
    s+=`<text class="city-label" x="${cx+cfg.dx}" y="${cy+cfg.dy}" text-anchor="${cfg.anchor}">${lbl}</text>`;
  });
  s+=`</g></svg>`;
  document.getElementById('chart1').insertAdjacentHTML('afterbegin',s);
}

render();

/* Legend */
const LEG_GROUPS={
  'leg-fr':    ['Paris','Lyon','Bordeaux','Nice','Nantes','Marseille'],

    if(!CITY_COLOR[ci]) return;
    const sp=document.createElement('span');sp.className='leg-item';
    const lbl=ci==='Dublin City'?'Dublin':ci;
    sp.innerHTML=`<span class="leg-dot" style="background:${CITY_COLOR[ci]}"></span>${lbl}`;
    el.appendChild(sp);
  });
});

/* Tooltip */
const tip=document.getElementById('tip');
function moveTip(e){
  if(tip.style.display==='none') return;
  let x=e.clientX+14,y=e.clientY-16;
  const tw=tip.offsetWidth||210,th=tip.offsetHeight||100;
  if(x+tw>window.innerWidth-8) x=e.clientX-tw-10;
  if(y+th>window.innerHeight-8) y=e.clientY-th-10;
  tip.style.left=x+'px';tip.style.top=y+'px';
}
function hideTip(){tip.style.display='none';}
const CO_FR={
  'France':'France','Germany':'Allemagne','Spain':'Espagne',
  'Ireland':'Irlande','New Zealand':'Nouvelle-Zélande'
};

const chartEl=document.getElementById('chart1');
chartEl.addEventListener('mousemove',e=>{
  const el=e.target;
  if(el.classList.contains('dot-mean')){
    const ci=el.dataset.city,m=MEANS[ci];
    if(!m){hideTip();return;}
    const col=CITY_COLOR[ci]||'#aaa';
    const lbl=ci==='Dublin City'?'Dublin':ci;
    tip.innerHTML=
      `<div class="tip-name" style="color:${col}">${lbl}</div>`+
      `<div class="tip-city">${CO_FR[m.co]||m.co} · ${m.n} restaurant${m.n>1?'s':''}</div>`+
      `<hr class="tip-sep">`+
      `<div class="tip-row"><span class="tip-lbl">Parité / plat moy.</span><span class="tip-val">${f1(m.my)} &#8364;</span></div>`+
      `<div class="tip-row"><span class="tip-lbl">&#215; PIB/hab moy.</span><span class="tip-val">&#215;${f1(m.mx)}</span></div>`;
    tip.style.display='block';moveTip(e);return;
  }
  if(el.classList.contains('dot-ind')){
    const r=DATA[+el.dataset.i];
    if(!r){hideTip();return;}
    tip.innerHTML=
      `<div class="tip-name">${r.n}</div>`+
      `<div class="tip-city">${r.ci}, ${CO_FR[r.co]||r.co}</div>`+
      `<hr class="tip-sep">`+
      `<div class="tip-row"><span class="tip-lbl">Prix relevé</span><span class="tip-val">${r.p}${r.nb?' ('+r.nb+' plats)':''} </span></div>`+
      `<div class="tip-row"><span class="tip-lbl">Parité / plat</span><span class="tip-val">${r.y} &#8364;</span></div>`+
      `<div class="tip-row"><span class="tip-lbl">&#215; PIB/hab</span><span class="tip-val">&#215;${r.x1}</span></div>`;
    tip.style.display='block';moveTip(e);return;
  }
  hideTip();
});
chartEl.addEventListener('mouseleave',hideTip);
document.addEventListener('mousemove',moveTip);

/* ── Zoom helpers ───────────────────────────────────── */
function getSvgEl(){return chartEl.querySelector('svg.sc');}
function svgCoords(e){
  const svgEl=getSvgEl();
  if(!svgEl) return {dx:0,dy:0};
  const rect=svgEl.getBoundingClientRect();
  // Scale from CSS pixels to SVG viewBox pixels
  const scaleX=W/rect.width, scaleY=H/rect.height;
  const svgX=(e.clientX-rect.left)*scaleX;
  const svgY=(e.clientY-rect.top)*scaleY;
  return {
    dataX: view.xmin+(svgX-PAD.left)/CW*(view.xmax-view.xmin),
    dataY: view.ymin+(1-(svgY-PAD.top)/CH)*(view.ymax-view.ymin),
  };
}

function applyZoom(factor,pivotDataX,pivotDataY){
  const {xmin,xmax,ymin,ymax}=view;
  const px=pivotDataX??((xmin+xmax)/2);
  const py=pivotDataY??((ymin+ymax)/2);
  view={
    xmin: px-(px-xmin)*factor,
    xmax: px+(xmax-px)*factor,
    ymin: py-(py-ymin)*factor,
    ymax: py+(ymax-py)*factor,
  };
  getSvgEl()?.remove();
  render();
}

/* Scroll to zoom */
chartEl.addEventListener('wheel',e=>{
  e.preventDefault();
  const factor=e.deltaY>0?1.15:1/1.15;
  const {dataX,dataY}=svgCoords(e);
  applyZoom(factor,dataX,dataY);
  hideTip();
},{passive:false});

/* Drag to pan */
let drag=null;
chartEl.addEventListener('mousedown',e=>{
  if(e.button!==0) return;
  drag={cx:e.clientX,cy:e.clientY,v:{...view}};
  getSvgEl()?.classList.add('dragging');
  e.preventDefault();
});
document.addEventListener('mousemove',e=>{
  if(!drag) return;
  const svgEl=getSvgEl();
  if(!svgEl) return;
  const rect=svgEl.getBoundingClientRect();
  const scaleX=W/rect.width,scaleY=H/rect.height;
  const ddx=(e.clientX-drag.cx)*scaleX/CW*(drag.v.xmax-drag.v.xmin);
  const ddy=(e.clientY-drag.cy)*scaleY/CH*(drag.v.ymax-drag.v.ymin);
  view={xmin:drag.v.xmin-ddx,xmax:drag.v.xmax-ddx,ymin:drag.v.ymin+ddy,ymax:drag.v.ymax+ddy};
  svgEl.remove();
  render();
  hideTip();
});
document.addEventListener('mouseup',()=>{
  if(drag) getSvgEl()?.classList.remove('dragging');
  drag=null;
});

/* Zoom buttons */
document.getElementById('btn-zi').addEventListener('click',()=>applyZoom(1/1.35));
document.getElementById('btn-zo').addEventListener('click',()=>applyZoom(1.35));
document.getElementById('btn-zr').addEventListener('click',()=>{
  view={xmin:XDEF.min,xmax:XDEF.max,ymin:YDEF.min,ymax:YDEF.max};
  getSvgEl()?.remove();render();
});
